<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My Book Library</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
    <div class="jumbotron text-center">
      <h1>Library</h1>
      <p>Add books to your library</p>
    </div>

    <div class="container">
      <button data-toggle="collapse" data-target="#demo" class="btn btn-info mb-3">
        Add new book
      </button>

      <div id="demo" class="collapse mb-4">
        <div class="card card-body">
          <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" class="form-control" id="title" required>
            
            <label for="author" class="mt-2">Author:</label>
            <input type="text" class="form-control" id="author" required>
            
            <label for="pages" class="mt-2">Pages:</label>
            <input type="number" class="form-control" id="pages" required>
            
            <div class="form-check mt-3 mb-3">
              <input type="checkbox" class="form-check-input" id="check">
              <label class="form-check-label" for="check">I have read this book</label>
            </div>
            
            <input type="submit" value="Add to Library" class="btn btn-primary" onclick="submit()">
          </div>
        </div>
      </div>

      <table class="table table-hover" id="display">
        <thead class="thead-dark">
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
